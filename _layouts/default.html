<!DOCTYPE html>
<html lang="pl" class="h-100">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="Festiwal wina domowego zrzeszający miłośników domowych trunków z Gilowic i okolic.">
    <meta name="keywords" content="fewido, wino, wino domowe, festiwal wina, enoturystyka, konkurs, domowe trunki, Gilowice, Żywiec, Żywiecczyzna">
    <meta name="viewport" content="width=device-width" />

    {% seo %}

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=B612+Mono:ital@1&family=Lobster+Two:ital@1&family=Roboto&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/assets/images/fewido-favi.png" />

  <body class="d-flex flex-column h-100 bg-color-50">

      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar" aria-controls="navbar" aria-expanded="false" aria-label="Nawigacja">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-md-center" id="navbar">
          <ul class="navbar-nav nav-underline">
            <li class="nav-item">
              <a class="nav-link {% if page.name == 'index.html' %}active{% endif %}" href="/">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house" viewBox="0 0 16 16">
                  <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z"/>
                </svg>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if page.name == '2025.html' %}active{% endif %}" href="/2025" title="2025">IV edycja</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if page.name == '2024.html' %}active{% endif %}" href="/2024" title="2024">III edycja</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if page.name == '2023.html' %}active{% endif %}" href="/2023" title="2023">II edycja</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if page.name == '2022.html' %}active{% endif %}" href="/2022" title="2022">I edycja</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <section class="container mt-4">
      {{ content }}
    </section>
    <footer class="mt-auto py-3 bg-color-100 border-top border-2">
      <div class="container ">
        <div class="text-center text-muted">
          <p class="d-md-inline d-sm-block">
            <a href="https://www.instagram.com/fewido/" class="btn btn-outline-secondary"><img src="/assets/images/instagram.svg" alt="instagram" title="Instagram"> @fewido</a>
          </p>
          <p class="d-md-inline d-sm-block">
            <a href="https://x.com/FeWiDo2021" class="btn btn-outline-secondary"><img src="/assets/images/twitter.svg" alt="twitter" title="Twitter"> @FeWiDo2021</a>
          </p>
          <p class="d-md-inline d-sm-block">
            <a href="mailto:kontakt@fewido.pl" class="btn btn-outline-secondary"><img src="/assets/images/envelope.svg" alt="email" title="Email"> kontakt@fewido.pl</a>
          </p>

      </div>
    </footer>
